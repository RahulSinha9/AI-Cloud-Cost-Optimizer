apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-cloud-cost-optimizer
  namespace: ai-cost
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-cloud-cost-optimizer
  template:
    metadata:
      labels:
        app: ai-cloud-cost-optimizer
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/REPLACE_ME/ai-cloud-cost-optimizer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: LOG_LEVEL
              value: INFO
            - name: ANOMALY_Z_THRESHOLD
              value: "2.5"
            - name: AI_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
